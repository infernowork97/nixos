creation_rules:
  # software-factory has an age key of its own, so a compromise of that server
  # reveals its own secrets and nothing else. sops uses the first rule that
  # matches, so this one must stay above the catch-all. The operator key is
  # added by `just operator-age-key` and the factory key by
  # `just factory-generate-age-key`, each replacing its marker line.
  - path_regex: secrets/hosts/software-factory\.yaml$
    key_groups:
      - age:
          # operator-age-key: not generated yet
          # software-factory-age-key: not generated yet
  - path_regex: secrets/.*\.yaml$
    key_groups:
      - age:
          # operator-age-key: not generated yet
